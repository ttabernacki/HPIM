<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Echo Snake</title>
<style>
  :root {
    --bg: #0b0f14; --panel: #131a22; --ink: #e6edf3; --dim: #8b98a5;
    --snake: #4ade80; --snake-head: #bbf7d0; --echo: #22d3ee; --food: #fb7185; --grid: #16202b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, sans-serif; display: grid; place-items: center; }
  main { width: min(100vw - 32px, 520px); padding: 16px 0; }
  h1 { margin: 0 0 8px; font-size: 1.4rem; letter-spacing: .04em; }
  h1 span { color: var(--echo); }
  #hud { display: flex; justify-content: space-between; gap: 8px; background: var(--panel);
         padding: 8px 12px; border-radius: 8px 8px 0 0; font-variant-numeric: tabular-nums; }
  #hud b { color: var(--dim); font-weight: 500; margin-right: 4px; }
  #pips { letter-spacing: 3px; color: var(--echo); }
  canvas { display: block; width: 100%; aspect-ratio: 1; background: var(--bg); touch-action: none;
           border: 1px solid var(--grid); border-radius: 0 0 8px 8px; }
  p { color: var(--dim); font-size: .85rem; margin: 10px 0 0; }
  kbd { background: var(--panel); border-radius: 4px; padding: 1px 6px; color: var(--ink); }
  #status { min-height: 1.4em; color: var(--echo); }
</style>
</head>
<body>
<main>
  <h1>ECHO <span>SNAKE</span></h1>
  <div id="hud">
    <div><b>Score</b><span id="score">0</span></div>
    <div><b>Best</b><span id="best">0</span></div>
    <div><b>Echo</b><span id="delay">24</span></div>
    <div><b>Blink</b><span id="pips"></span></div>
  </div>
  <canvas id="c" width="480" height="480" aria-label="Echo Snake game board"></canvas>
  <p id="status" role="status" aria-live="polite"></p>
  <p>Your past self trails you as a deadly <span style="color:var(--echo)">echo</span>. Each food shrinks its delay. <kbd>Space</kbd> blinks you onto the echo's head (limited charges, earn one every 4 foods). <kbd>Arrows</kbd>/<kbd>WASD</kbd> move, <kbd>P</kbd> pause, <kbd>R</kbd> restart. On touch: swipe to steer, tap to blink.</p>
</main>
<script>
(() => {
  const N = 20, CELL = 24, START_DELAY = 24, MIN_DELAY = 10, MAX_CHARGES = 3, FOODS_PER_CHARGE = 4;
  const cv = document.getElementById("c"), ctx = cv.getContext("2d");
  const $ = id => document.getElementById(id);
  const eq = (a, b) => a.x === b.x && a.y === b.y;
  const wrap = v => (v + N) % N;
  let S, best = 0;
  try { best = +localStorage.getItem("echo-snake-best") || 0; } catch (e) {}

  function reset() {
    const snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
    S = { snake, dir: {x: 1, y: 0}, queue: [], hist: snake.slice().reverse(),
          delay: START_DELAY, food: null, score: 0, foods: 0, charges: 1,
          alive: true, paused: false, msg: "" };
    S.food = spawnFood();
    hud();
  }

  function ghostCells() {
    const out = [], end = S.hist.length - 1 - S.delay;
    for (let k = 0; k < S.snake.length; k++) {
      const i = end - k;
      if (i >= 0) out.push(S.hist[i]);
    }
    return out;
  }

  function spawnFood() {
    const busy = new Set(S.snake.concat(ghostCells()).map(p => p.x + "," + p.y));
    const free = [];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if (!busy.has(x + "," + y)) free.push({x, y});
    return free.length ? free[Math.floor(Math.random() * free.length)] : null;
  }

  function say(m) { S.msg = m; $("status").textContent = m; }

  function die(why) {
    S.alive = false;
    if (S.score > best) {
      best = S.score;
      try { localStorage.setItem("echo-snake-best", String(best)); } catch (e) {}
    }
    say(why === "echo" ? "Caught by your own echo. Press R to restart." : "You ran into yourself. Press R to restart.");
    hud();
  }

  function step() {
    if (!S.alive || S.paused) return;
    if (S.queue.length) {
      const d = S.queue.shift();
      if (!(d.x === -S.dir.x && d.y === -S.dir.y)) S.dir = d;
    }
    const h = S.snake[0];
    const nh = {x: wrap(h.x + S.dir.x), y: wrap(h.y + S.dir.y)};
    const eat = S.food && eq(nh, S.food);
    const body = eat ? S.snake : S.snake.slice(0, -1);
    if (body.some(p => eq(p, nh))) return die("self");
    if (ghostCells().some(p => eq(p, nh))) return die("echo");
    S.snake.unshift(nh);
    if (!eat) S.snake.pop();
    S.hist.push(nh);
    while (S.hist.length > 800) S.hist.shift();
    if (eat) {
      S.score += 10; S.foods++;
      S.delay = Math.max(MIN_DELAY, S.delay - 1);
      if (S.foods % FOODS_PER_CHARGE === 0 && S.charges < MAX_CHARGES) { S.charges++; say("Blink charge gained."); }
      else if (S.msg) say("");
      S.food = spawnFood();
    }
    hud();
  }

  function blink() {
    if (!S.alive || S.paused) return false;
    if (S.charges < 1) { say("No blink charges."); return false; }
    const g = S.hist[S.hist.length - 1 - S.delay];
    if (!g) { say("No echo yet."); return false; }
    if (S.snake.slice(1).some(p => eq(p, g))) { say("Echo is overlapping your body. Blink blocked."); return false; }
    S.charges--;
    S.snake[0] = {x: g.x, y: g.y};
    S.hist.push({x: g.x, y: g.y});
    say("Blinked.");
    hud();
    return true;
  }

  function turn(x, y) {
    const last = S.queue.length ? S.queue[S.queue.length - 1] : S.dir;
    if (last.x === x && last.y === y) return;
    if (S.queue.length < 2) S.queue.push({x, y});
  }

  function hud() {
    $("score").textContent = S.score;
    $("best").textContent = best;
    $("delay").textContent = S.delay;
    $("pips").textContent = "◆".repeat(S.charges) + "◇".repeat(MAX_CHARGES - S.charges);
  }

  function cell(p, pad, r) {
    ctx.beginPath();
    ctx.roundRect(p.x * CELL + pad, p.y * CELL + pad, CELL - 2 * pad, CELL - 2 * pad, r);
    ctx.fill();
  }

  function draw() {
    const css = getComputedStyle(document.documentElement);
    const v = n => css.getPropertyValue(n).trim();
    ctx.fillStyle = v("--bg"); ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.strokeStyle = v("--grid"); ctx.lineWidth = 1;
    for (let i = 1; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, cv.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(cv.width, i * CELL); ctx.stroke();
    }
    const gc = ghostCells();
    gc.forEach((p, i) => { ctx.fillStyle = v("--echo"); ctx.globalAlpha = i === 0 ? .8 : .35; cell(p, 2, 6); });
    ctx.globalAlpha = 1;
    if (S.food) { ctx.fillStyle = v("--food"); cell(S.food, 5, 12); }
    S.snake.forEach((p, i) => { ctx.fillStyle = i === 0 ? v("--snake-head") : v("--snake"); cell(p, 1.5, 6); });
    if (!S.alive || S.paused) {
      ctx.fillStyle = "rgba(11,15,20,.72)"; ctx.fillRect(0, 0, cv.width, cv.height);
      ctx.fillStyle = v("--ink"); ctx.textAlign = "center"; ctx.font = "600 28px system-ui";
      ctx.fillText(S.alive ? "Paused" : "Game over", cv.width / 2, cv.height / 2 - 6);
      ctx.font = "16px system-ui"; ctx.fillStyle = v("--dim");
      ctx.fillText(S.alive ? "Press P to resume" : "Score " + S.score + " · press R or tap", cv.width / 2, cv.height / 2 + 24);
    }
  }

  let last = 0;
  function loop(t) {
    const interval = Math.max(70, 120 - S.foods * 3);
    if (t - last >= interval) { last = t; step(); }
    draw();
    requestAnimationFrame(loop);
  }

  const KEYS = { ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
                 ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0] };
  addEventListener("keydown", e => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (KEYS[k]) { turn(...KEYS[k]); e.preventDefault(); }
    else if (k === " ") { blink(); e.preventDefault(); }
    else if (k === "p") { S.paused = !S.paused; say(S.paused ? "Paused." : ""); }
    else if (k === "r") { reset(); say(""); }
  });

  let t0 = null;
  cv.addEventListener("touchstart", e => { t0 = e.changedTouches[0]; }, {passive: true});
  cv.addEventListener("touchend", e => {
    if (!t0) return;
    const t1 = e.changedTouches[0], dx = t1.clientX - t0.clientX, dy = t1.clientY - t0.clientY;
    t0 = null;
    if (!S.alive) { reset(); say(""); return; }
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) { blink(); return; }
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  }, {passive: true});

  reset();
  window.__snake = { state: () => S, step, blink, reset, turn, ghostCells, spawnFood };
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
